# Managed by the frontend production deployment. This file is included inside
# the existing damkemon.com server block; TLS, the web root and the API proxy
# remain owned by the server's main site configuration.

# Humans receive the React application. Search engines and link-preview bots
# receive the backend's lightweight product HTML with canonical, AggregateOffer
# JSON-LD and visible seller prices.
location /product/ {
    add_header Vary "User-Agent" always;
    error_page 418 = @damkemon_product_metadata;

    # `if` is used only for an immediate return, the safe nginx use-case.
    if ($http_user_agent ~* "(googlebot|bingbot|duckduckbot|yandexbot|baiduspider|facebookexternalhit|facebot|whatsapp|twitterbot|telegrambot)") {
        return 418;
    }

    try_files $uri /index.html;
}

location @damkemon_product_metadata {
    proxy_pass         http://127.0.0.1:8080;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# Server redirects remove obsolete product claims before JavaScript executes
# and give crawlers a permanent signal.
location = /guides/buying-from-unknown-seller-use-protect {
    return 301 https://damkemon.com/guides/buying-from-unknown-seller-check-risk;
}

location = /protect {
    return 301 https://damkemon.com/;
}
