name: Deploy Frontend to Production

on:
  push:
    branches:
      - deployment-prod

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Opaque API prefix. Unset → falls back to /api (no-op). Set the repo
          # variable VITE_API_BASE=/_dk to switch the bundle to the cloaked path
          # — only AFTER nginx maps /_dk/ → backend /api/ (deploy/nginx.conf.example).
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_ENV_LABEL: production
          # NOTE: the Google client id is NOT a build var — the frontend reads it
          # at runtime from GET /api/auth/config (backend GOOGLE_CLIENT_ID env is
          # the single source of truth).

      - name: Copy build to temporary directory on server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/*"
          target: "/home/${{ vars.SERVER_USER }}/frontend-temp/"
          strip_components: 1

      - name: Copy managed nginx routes to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy/nginx/damkemon-managed-routes.conf,deploy/nginx/install-managed-routes.sh"
          target: "/home/${{ vars.SERVER_USER }}/frontend-ops/"
          strip_components: 2

      - name: Deploy frontend to web root
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Create deployment path if it does not exist
            sudo mkdir -p ${{ vars.FRONTEND_PROD_DEPLOY_PATH }}
            
            # Clean up current files in the deployment folder
            sudo rm -rf ${{ vars.FRONTEND_PROD_DEPLOY_PATH }}/*
            
            # Move files from temp path to deployment folder
            sudo mv /home/${{ vars.SERVER_USER }}/frontend-temp/* ${{ vars.FRONTEND_PROD_DEPLOY_PATH }}/
            
            # Remove temp directory
            sudo rm -rf /home/${{ vars.SERVER_USER }}/frontend-temp
            
            # Ensure correct permissions
            sudo chown -R www-data:www-data ${{ vars.FRONTEND_PROD_DEPLOY_PATH }}

            # Keep crawler metadata and obsolete-route redirects in production.
            # The installer discovers the active site file, validates nginx and
            # restores the previous file automatically if validation fails.
            bash /home/${{ vars.SERVER_USER }}/frontend-ops/install-managed-routes.sh \
              /home/${{ vars.SERVER_USER }}/frontend-ops/damkemon-managed-routes.conf
            rm -rf /home/${{ vars.SERVER_USER }}/frontend-ops
